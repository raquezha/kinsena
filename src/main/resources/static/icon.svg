<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark obsidian canvas glow -->
    <radialGradient id="canvasGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#191610"/>
      <stop offset="60%" stop-color="#0a0907"/>
      <stop offset="100%" stop-color="#040403"/>
    </radialGradient>
    
    <!-- Premium Brushed Champagne / Titanium Gold Gradient -->
    <linearGradient id="goldMonolith" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6e2"/>
      <stop offset="25%" stop-color="#ecd39d"/>
      <stop offset="65%" stop-color="#cda863"/>
      <stop offset="100%" stop-color="#9a7637"/>
    </linearGradient>
    
    <!-- Drop Shadow for architectural presence -->
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#cda863" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer App Icon Base -->
  <rect width="512" height="512" rx="116" fill="#040403"/>
  <rect x="18" y="18" width="476" height="476" rx="100" fill="url(#canvasGlow)" stroke="rgba(205, 168, 99, 0.2)" stroke-width="2"/>
  
  <!-- 4 Monolithic Gold Architectural Blocks -->
  <g filter="url(#goldShadow)">
    <path d="M 112,112
    H 240
    A 0,0 0 0 1 240,112
    V 240
    A 0,0 0 0 1 240,240
    H 112
    A 0,0 0 0 1 112,240
    V 112
    A 0,0 0 0 1 112,112 Z" fill="url(#goldMonolith)"/>
    <path d="M 302,112
    H 390
    A 0,0 0 0 1 390,112
    V 200
    A 40,40 0 0 1 350,240
    H 302
    A 40,40 0 0 1 262,200
    V 152
    A 40,40 0 0 1 302,112 Z" fill="url(#goldMonolith)"/>
    <path d="M 112,262
    H 240
    A 0,0 0 0 1 240,262
    V 390
    A 0,0 0 0 1 240,390
    H 112
    A 0,0 0 0 1 112,390
    V 262
    A 0,0 0 0 1 112,262 Z" fill="url(#goldMonolith)"/>
    <path d="M 302,262
    H 350
    A 40,40 0 0 1 390,302
    V 390
    A 0,0 0 0 1 390,390
    H 302
    A 40,40 0 0 1 262,350
    V 302
    A 40,40 0 0 1 302,262 Z" fill="url(#goldMonolith)"/>
  </g>
</svg>