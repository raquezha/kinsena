<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141816"/>
      <stop offset="100%" stop-color="#080a09"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6eee0"/>
      <stop offset="100%" stop-color="#a0c7af"/>
    </linearGradient>
  </defs>
  <!-- App Icon Base -->
  <rect width="512" height="512" rx="116" fill="#080a09"/>
  <rect x="18" y="18" width="476" height="476" rx="100" fill="url(#bgGrad)" stroke="rgba(181, 216, 193, 0.14)" stroke-width="2"/>
  
  <!-- 4-Box "K" System -->
  <!-- Box 1: Top-Left Stem Box -->
  <rect x="110" y="96" width="98" height="144" rx="22" fill="url(#mintGrad)"/>
  
  <!-- Box 3: Bottom-Left Stem Box -->
  <rect x="110" y="272" width="98" height="144" rx="22" fill="url(#mintGrad)"/>
  
  <!-- Box 2: Top-Right "/" Diagonal Box -->
  <rect x="238" y="112" width="98" height="144" rx="22" fill="url(#mintGrad)" transform="rotate(-36 287 184)"/>
  
  <!-- Box 4: Bottom-Right "" Diagonal Box -->
  <rect x="238" y="256" width="98" height="144" rx="22" fill="url(#mintGrad)" transform="rotate(36 287 328)"/>
</svg>